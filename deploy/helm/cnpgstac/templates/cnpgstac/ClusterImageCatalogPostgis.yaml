apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgis-standard-trixie
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: cnpgstac
    images.cnpg.io/family: postgis
    images.cnpg.io/type: standard
    images.cnpg.io/os: trixie
    images.cnpg.io/date: '20251006'
    images.cnpg.io/publisher: cnpg.io
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonLabels "context" $) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  images:
  - major: 13
    image: ghcr.io/cloudnative-pg/postgis:13-3-standard-trixie
  - major: 14
    image: ghcr.io/cloudnative-pg/postgis:14-3-standard-trixie
  - major: 15
    image: ghcr.io/cloudnative-pg/postgis:15-3-standard-trixie
  - major: 16
    image: ghcr.io/cloudnative-pg/postgis:16-3-standard-trixie
  - major: 17
    image: ghcr.io/cloudnative-pg/postgis:17-3-standard-trixie
  - major: 18
    image: ghcr.io/cloudnative-pg/postgis:18-3-standard-trixie